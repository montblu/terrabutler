# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/terrabutler
    binary: terrabutler
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

# Explicit `files` replaces goreleaser's default list (LICENSE*/README*/CHANGELOG*), so those are
# spelled out here too. `skills/**/*` ships the Agent Skill at `skills/terrabutler/` inside the
# archive, matching the `archive:skills/terrabutler` resource declared in the packslip release step.
archives:
  - files:
      - LICENSE*
      - README*
      - CHANGELOG*
      - skills/**/*
